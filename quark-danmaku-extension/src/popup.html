<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quark Danmaku Overlay</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        color: #111827;
        background: #f8fafc;
        font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      p {
        margin: 8px 0;
      }

      code {
        padding: 1px 4px;
        border-radius: 4px;
        background: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <h1>网盘弹幕</h1>
    <p>打开夸克网盘或百度网盘网页版视频后，右下角会出现“弹”按钮。</p>
    <p>当前版本支持导入 <code>.xml</code>、<code>.ass</code>、<code>.json</code> 弹幕并叠加播放。</p>
  </body>
</html>
